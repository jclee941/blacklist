services:
  blacklist-postgres:
    extends:
      file: base.yml
      service: blacklist-postgres
    image: blacklist-postgres:${BLACKLIST_VERSION:?BLACKLIST_VERSION must be set; it is written into the env file by install.sh}

  blacklist-redis:
    extends:
      file: base.yml
      service: blacklist-redis
    image: blacklist-redis:${BLACKLIST_VERSION:?BLACKLIST_VERSION must be set; it is written into the env file by install.sh}

  blacklist-collector:
    extends:
      file: base.yml
      service: blacklist-collector
    image: blacklist-collector:${BLACKLIST_VERSION:?BLACKLIST_VERSION must be set; it is written into the env file by install.sh}

  blacklist-app:
    extends:
      file: base.yml
      service: blacklist-app
    image: blacklist-app:${BLACKLIST_VERSION:?BLACKLIST_VERSION must be set; it is written into the env file by install.sh}

  blacklist-frontend:
    extends:
      file: base.yml
      service: blacklist-frontend
    image: blacklist-frontend:${BLACKLIST_VERSION:?BLACKLIST_VERSION must be set; it is written into the env file by install.sh}

volumes:
  blacklist-pgdata:
  blacklist-redis-data:
  blacklist-collector-data:
  blacklist-collector-logs:
  blacklist-logs:
  blacklist-uploads:
  blacklist-app-data:

networks:
  blacklist-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${BLACKLIST_NETWORK_SUBNET:-172.30.0.0/24}
