global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Blacklist Flask API (/metrics endpoint)
  - job_name: "blacklist-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:2542"]
        labels:
          service: "blacklist-app"
          environment: "sandbox"

  # blacklist-collector: no /metrics endpoint

  # PostgreSQL metrics via postgres-exporter
  - job_name: "postgres"
    static_configs:
      - targets: ["localhost:9187"]
        labels:
          service: "postgres"
          environment: "sandbox"

  # Redis metrics via redis-exporter
  - job_name: "redis"
    static_configs:
      - targets: ["localhost:9121"]
        labels:
          service: "redis"
          environment: "sandbox"

  # Host/node metrics
  - job_name: "node"
    static_configs:
      - targets: ["localhost:9100"]
        labels:
          instance: "sandbox-220"
          environment: "sandbox"
