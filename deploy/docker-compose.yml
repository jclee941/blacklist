services:
  blacklist-postgres:
    extends:
      file: base.yml
      service: blacklist-postgres
    build:
      context: ../postgres
      dockerfile: Dockerfile
    image: blacklist-postgres:latest

  blacklist-redis:
    extends:
      file: base.yml
      service: blacklist-redis
    build:
      context: redis
      dockerfile: Dockerfile
    image: blacklist-redis:latest

  blacklist-collector:
    extends:
      file: base.yml
      service: blacklist-collector
    build:
      context: ..
      dockerfile: collector/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: blacklist-collector:latest
    environment:
      WARP_PROXY_URL: http://127.0.0.1:40000

  blacklist-app:
    extends:
      file: base.yml
      service: blacklist-app
    build:
      context: ..
      dockerfile: app/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: blacklist-app:latest
    environment:
      DISABLE_JWT_AUTH: ${DISABLE_JWT_AUTH:-false}

  blacklist-frontend:
    extends:
      file: base.yml
      service: blacklist-frontend
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: blacklist-frontend:latest

volumes:
  blacklist-pgdata:
  blacklist-redis-data:
  blacklist-collector-data:
  blacklist-logs:
  blacklist-uploads:
  blacklist-app-data:

networks:
  blacklist-net:
    driver: bridge
