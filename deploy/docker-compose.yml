services:
  blacklist-postgres:
    extends:
      file: base.yml
      service: blacklist-postgres
    build:
      context: ../postgres
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${BLACKLIST_VERSION:-0.0.0-dev}
    image: blacklist-postgres:latest

  blacklist-redis:
    extends:
      file: base.yml
      service: blacklist-redis
    build:
      context: redis
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${BLACKLIST_VERSION:-0.0.0-dev}
    image: blacklist-redis:latest

  blacklist-collector:
    extends:
      file: base.yml
      service: blacklist-collector
    build:
      context: ..
      dockerfile: collector/Dockerfile
      args:
        APP_VERSION: ${BLACKLIST_VERSION:-0.0.0-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: blacklist-collector:latest
    environment:
      # Development turns WARP on by default; set WARP_ENABLED=false in deploy/.env to
      # collect directly. base.yml supplies WARP_PROXY_URL and the host-gateway alias.
      WARP_ENABLED: ${WARP_ENABLED:-true}
    # REGTECH blocks this network's egress IP, so development sends the collector's
    # requests through a WARP proxy on the developer's host. This is an
    # APPLICATION-level proxy, so it affects only the collector's outbound REGTECH
    # calls; no other service or host interface is routed through WARP.
    #
    # On the bridge network 127.0.0.1 is the container itself, so the host gateway
    # alias is required. MEASURED: a proxy bound to 127.0.0.1 only is REFUSED from
    # the bridge; it must listen on an address the gateway can reach. For
    # Cloudflare WARP run:
    #   warp-cli proxy port 40000        # then relay it on the Docker gateway, e.g. 172.17.0.1:40000
    # Verify with:
    #   docker run --rm --add-host=host.docker.internal:host-gateway alpine \
    #     wget -qO- http://host.docker.internal:40000/

  blacklist-app:
    extends:
      file: base.yml
      service: blacklist-app
    build:
      context: ..
      dockerfile: app/Dockerfile
      args:
        APP_VERSION: ${BLACKLIST_VERSION:-0.0.0-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: blacklist-app:latest
    environment:
      DISABLE_JWT_AUTH: ${DISABLE_JWT_AUTH:-false}

  blacklist-frontend:
    extends:
      file: base.yml
      service: blacklist-frontend
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        APP_VERSION: ${BLACKLIST_VERSION:-0.0.0-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: blacklist-frontend:latest

volumes:
  blacklist-pgdata:
  blacklist-redis-data:
  blacklist-collector-data:
  blacklist-collector-logs:
  blacklist-logs:
  blacklist-uploads:
  blacklist-app-data:

networks:
  blacklist-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${BLACKLIST_NETWORK_SUBNET:-172.30.0.0/24}
