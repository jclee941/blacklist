# Shared base service definitions for Blacklist platform
# Used by docker-compose.yml and docker-compose.release.yml via 'extends'
#
# NOTE: This file is NOT used directly. Each environment extends these
# service definitions and adds its own image/build configuration.

services:
  blacklist-postgres:
    container_name: blacklist-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 200
    mem_limit: 1g
    networks:
      - blacklist-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blacklist}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB_USER: ${APP_DB_USER:-blacklist_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      COLLECTOR_DB_USER: ${COLLECTOR_DB_USER:-blacklist_collector}
      COLLECTOR_DB_PASSWORD: ${COLLECTOR_DB_PASSWORD:?COLLECTOR_DB_PASSWORD is required}
      TZ: Asia/Seoul
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/blacklist/tls/tls.crt
      - -c
      - ssl_key_file=/run/blacklist/tls/tls.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - blacklist-pgdata:/var/lib/postgresql/data
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/postgres:/run/blacklist/tls:ro
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/ca/ca.crt:/run/blacklist/ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", 'PGPASSWORD="$$POSTGRES_PASSWORD" PGSSLMODE=verify-full PGSSLROOTCERT=/run/blacklist/ca.crt psql -h blacklist-postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1" | grep -qx 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  blacklist-redis:
    container_name: blacklist-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    pids_limit: 100
    mem_limit: 512m
    networks:
      - blacklist-net
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --bind
      - 0.0.0.0
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /run/blacklist/tls/tls.crt
      - --tls-key-file
      - /run/blacklist/tls/tls.key
      - --tls-ca-cert-file
      - /run/blacklist/ca.crt
      - --tls-auth-clients
      - "no"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - blacklist-redis-data:/data
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/redis:/run/blacklist/tls:ro
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/ca/ca.crt:/run/blacklist/ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --tls --cacert /run/blacklist/ca.crt -h blacklist-redis ping | grep -qx PONG']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  blacklist-collector:
    container_name: blacklist-collector
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    networks:
      - blacklist-net
    depends_on:
      blacklist-postgres:
        condition: service_healthy
      blacklist-redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: blacklist-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-blacklist}
      POSTGRES_USER: ${COLLECTOR_DB_USER:-blacklist_collector}
      POSTGRES_PASSWORD: ${COLLECTOR_DB_PASSWORD:?COLLECTOR_DB_PASSWORD is required}
      REDIS_HOST: blacklist-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      INTERNAL_CA_CERT: /run/blacklist/ca.crt
      INTERNAL_TLS_CERT: /run/blacklist/tls/tls.crt
      INTERNAL_TLS_KEY: /run/blacklist/tls/tls.key
      HEALTH_CHECK_PORT: 8545
      BLACKLIST_API_URL: https://blacklist-app:2542
      COLLECTION_INTERVAL: 86400
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?CREDENTIAL_MASTER_KEY is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      COLLECTOR_AUTH_TOKEN: ${COLLECTOR_AUTH_TOKEN:?COLLECTOR_AUTH_TOKEN is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?ENCRYPTION_SALT is required}
      WARP_ENABLED: "false"
      WARP_PROXY_URL: ""
      FORTIGATE_CA_CERT: /run/blacklist/fortigate/ca.crt
      FORTIGATE_SSH_KNOWN_HOSTS: /run/blacklist/fortigate/known_hosts
      REGTECH_RATE_INITIAL: ${REGTECH_RATE_INITIAL:-}
      REGTECH_RATE_MIN: ${REGTECH_RATE_MIN:-}
      REGTECH_RATE_MAX: ${REGTECH_RATE_MAX:-}
      REGTECH_RATE_BURST: ${REGTECH_RATE_BURST:-}
      REGTECH_BLOCK_THRESHOLD: ${REGTECH_BLOCK_THRESHOLD:-}
      # ADR-0002 (0002-collector-authentication-enforcement) enforces bearer authentication on collector control routes.
      DISABLE_JWT_AUTH: "false"
      TZ: Asia/Seoul
    volumes:
      - blacklist-collector-data:/app/data
      - blacklist-collector-logs:/app/logs
      - ${FORTIGATE_TRUST_DIR:-/etc/blacklist/fortigate}:/run/blacklist/fortigate:ro
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/ca/ca.crt:/run/blacklist/ca.crt:ro
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/collector:/run/blacklist/tls:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "--cacert", "/run/blacklist/ca.crt", "https://blacklist-collector:8545/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  blacklist-app:
    container_name: blacklist-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    networks:
      - blacklist-net
    depends_on:
      blacklist-postgres:
        condition: service_healthy
      blacklist-redis:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      PORT: 2542
      POSTGRES_HOST: blacklist-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-blacklist}
      POSTGRES_USER: ${APP_DB_USER:-blacklist_app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      REDIS_HOST: blacklist-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      INTERNAL_CA_CERT: /run/blacklist/ca.crt
      INTERNAL_TLS_CERT: /run/blacklist/tls/tls.crt
      INTERNAL_TLS_KEY: /run/blacklist/tls/tls.key
      COLLECTOR_URL: https://blacklist-collector:8545
      COLLECTOR_COLLECTION_TIMEOUT: ${COLLECTOR_COLLECTION_TIMEOUT:-360}
      BLACKLIST_API_URL: https://blacklist-app:2542/api
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?CREDENTIAL_MASTER_KEY is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?FLASK_SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY is required}
      COLLECTOR_AUTH_TOKEN: ${COLLECTOR_AUTH_TOKEN:?COLLECTOR_AUTH_TOKEN is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?ENCRYPTION_SALT is required}
      TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-172.30.0.10/32}
      FORTINET_FEED_TOKEN: ${FORTINET_FEED_TOKEN:-}
      FORTINET_FEED_ALLOWED_NETWORKS: ${FORTINET_FEED_ALLOWED_NETWORKS:-}
      FORTIGATE_ALLOWED_NETWORKS: ${FORTIGATE_ALLOWED_NETWORKS:-}
      FORTIGATE_CA_CERT: /run/blacklist/fortigate/ca.crt
      FORTIGATE_SSH_KNOWN_HOSTS: /run/blacklist/fortigate/known_hosts
      # Generated on the TARGET host by install.sh and never shipped in the bundle.
      # Without these the app falls back to a login it can never satisfy.
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - blacklist-logs:/app/logs
      - blacklist-uploads:/app/uploads
      - blacklist-app-data:/app/data
      - ${FORTIGATE_TRUST_DIR:-/etc/blacklist/fortigate}:/run/blacklist/fortigate:ro
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/ca/ca.crt:/run/blacklist/ca.crt:ro
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/app:/run/blacklist/tls:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "--cacert", "/run/blacklist/ca.crt", "https://blacklist-app:2542/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  blacklist-frontend:
    container_name: blacklist-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 768m
    networks:
      blacklist-net:
        ipv4_address: ${FRONTEND_INTERNAL_IP:-172.30.0.10}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:443:3000"
    depends_on:
      blacklist-app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://blacklist-app:2542
      INTERNAL_CA_CERT: /run/blacklist/ca.crt
      NODE_OPTIONS: --require=/run/blacklist/frontend-internal-tls.cjs
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      FRONTEND_TLS_MODE: ${FRONTEND_TLS_MODE:-provided}
      FRONTEND_TLS_SERVER_NAME: ${FRONTEND_TLS_SERVER_NAME:-}
      TZ: Asia/Seoul
    volumes:
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/ca/ca.crt:/run/blacklist/ca.crt:ro
      - ./frontend-internal-tls.cjs:/run/blacklist/frontend-internal-tls.cjs:ro
      - ${BLACKLIST_FRONTEND_TLS_DIR:-/etc/blacklist/frontend-tls}:/app/ssl
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const http=require('http');const https=require('https');
          http.get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1)})
          .on('error',()=>{https.get({hostname:'localhost',port:3000,path:'/health',
          rejectUnauthorized:false},r=>{process.exit(r.statusCode===200?0:1)})
          .on('error',()=>process.exit(1))})"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  blacklist-pgdata:
  blacklist-redis-data:
  blacklist-collector-data:
  blacklist-collector-logs:
  blacklist-logs:
  blacklist-uploads:
  blacklist-app-data:

networks:
  blacklist-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${BLACKLIST_NETWORK_SUBNET:-172.30.0.0/24}
