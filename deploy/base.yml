# Shared base service definitions for Blacklist platform
# Used by docker-compose.yml and docker-compose.release.yml via 'extends'
#
# NOTE: This file is NOT used directly. Each environment extends these
# service definitions and adds its own image/build configuration.

services:
  blacklist-postgres:
    container_name: blacklist-postgres
    restart: unless-stopped
    networks:
      - blacklist-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blacklist}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - blacklist-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blacklist"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  blacklist-redis:
    container_name: blacklist-redis
    restart: unless-stopped
    networks:
      - blacklist-net
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --bind
      - 0.0.0.0
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - blacklist-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  blacklist-collector:
    container_name: blacklist-collector
    restart: unless-stopped
    networks:
      - blacklist-net
    depends_on:
      blacklist-postgres:
        condition: service_healthy
      blacklist-redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: blacklist-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-blacklist}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: blacklist-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      HEALTH_CHECK_PORT: 8545
      BLACKLIST_API_URL: http://blacklist-app:2542
      COLLECTION_INTERVAL: 86400
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?CREDENTIAL_MASTER_KEY is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      COLLECTOR_AUTH_TOKEN: ${COLLECTOR_AUTH_TOKEN:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?ENCRYPTION_SALT is required}
      # ADR-0002 (0002-collector-authentication-enforcement) enforces bearer authentication on collector control routes.
      DISABLE_JWT_AUTH: "false"
      TZ: Asia/Seoul
    volumes:
      - blacklist-collector-data:/app/data
      - blacklist-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  blacklist-app:
    container_name: blacklist-app
    restart: unless-stopped
    networks:
      - blacklist-net
    depends_on:
      blacklist-postgres:
        condition: service_healthy
      blacklist-redis:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      PORT: 2542
      SSL_ENABLED: "false"
      POSTGRES_HOST: blacklist-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-blacklist}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: blacklist-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      COLLECTOR_URL: http://blacklist-collector:8545
      BLACKLIST_API_URL: http://blacklist-app:2542/api
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?CREDENTIAL_MASTER_KEY is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      COLLECTOR_AUTH_TOKEN: ${COLLECTOR_AUTH_TOKEN:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?ENCRYPTION_SALT is required}
      TZ: Asia/Seoul
    volumes:
      - blacklist-logs:/app/logs
      - blacklist-uploads:/app/uploads
      - blacklist-app-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2542/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  blacklist-frontend:
    container_name: blacklist-frontend
    restart: unless-stopped
    networks:
      - blacklist-net
    ports:
      - "443:3000"
    depends_on:
      blacklist-app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://blacklist-app:2542
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Seoul
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const http=require('http');const https=require('https');
          http.get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1)})
          .on('error',()=>{https.get({hostname:'localhost',port:3000,path:'/health',
          rejectUnauthorized:false},r=>{process.exit(r.statusCode===200?0:1)})
          .on('error',()=>process.exit(1))})"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  blacklist-pgdata:
  blacklist-redis-data:
  blacklist-collector-data:
  blacklist-logs:
  blacklist-uploads:
  blacklist-app-data:

networks:
  blacklist-net:
    driver: bridge
