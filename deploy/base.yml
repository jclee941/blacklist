# Shared base service definitions for Blacklist platform
# Used by docker-compose.yml and docker-compose.release.yml via 'extends'
#
# NOTE: This file is NOT used directly. Each environment extends these
# service definitions and adds its own image/build configuration.

services:
  blacklist-postgres:
    container_name: blacklist-postgres
    restart: unless-stopped
    networks:
      - blacklist-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blacklist}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Seoul
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/blacklist/tls/tls.crt
      - -c
      - ssl_key_file=/run/blacklist/tls/tls.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
    volumes:
      - blacklist-pgdata:/var/lib/postgresql/data
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/postgres:/run/blacklist/tls:ro
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/ca/ca.crt:/run/blacklist/ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", 'PGPASSWORD="$$POSTGRES_PASSWORD" PGSSLMODE=verify-full PGSSLROOTCERT=/run/blacklist/ca.crt psql -h blacklist-postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1" | grep -qx 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  blacklist-redis:
    container_name: blacklist-redis
    restart: unless-stopped
    networks:
      - blacklist-net
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --bind
      - 0.0.0.0
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /run/blacklist/tls/tls.crt
      - --tls-key-file
      - /run/blacklist/tls/tls.key
      - --tls-ca-cert-file
      - /run/blacklist/ca.crt
      - --tls-auth-clients
      - "no"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - blacklist-redis-data:/data
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/redis:/run/blacklist/tls:ro
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/ca/ca.crt:/run/blacklist/ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --tls --cacert /run/blacklist/ca.crt -h blacklist-redis ping | grep -qx PONG']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  blacklist-collector:
    container_name: blacklist-collector
    restart: unless-stopped
    networks:
      - blacklist-net
    depends_on:
      blacklist-postgres:
        condition: service_healthy
      blacklist-redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: blacklist-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-blacklist}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: blacklist-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      INTERNAL_CA_CERT: /run/blacklist/ca.crt
      INTERNAL_TLS_CERT: /run/blacklist/tls/tls.crt
      INTERNAL_TLS_KEY: /run/blacklist/tls/tls.key
      HEALTH_CHECK_PORT: 8545
      BLACKLIST_API_URL: https://blacklist-app:2542
      COLLECTION_INTERVAL: 86400
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?CREDENTIAL_MASTER_KEY is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      COLLECTOR_AUTH_TOKEN: ${COLLECTOR_AUTH_TOKEN:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?ENCRYPTION_SALT is required}
      # ADR-0002 (0002-collector-authentication-enforcement) enforces bearer authentication on collector control routes.
      DISABLE_JWT_AUTH: "false"
      TZ: Asia/Seoul
    volumes:
      - blacklist-collector-data:/app/data
      - blacklist-logs:/app/logs
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/ca/ca.crt:/run/blacklist/ca.crt:ro
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/collector:/run/blacklist/tls:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "--cacert", "/run/blacklist/ca.crt", "https://blacklist-collector:8545/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  blacklist-app:
    container_name: blacklist-app
    restart: unless-stopped
    networks:
      - blacklist-net
    depends_on:
      blacklist-postgres:
        condition: service_healthy
      blacklist-redis:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      PORT: 2542
      POSTGRES_HOST: blacklist-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-blacklist}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: blacklist-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      INTERNAL_CA_CERT: /run/blacklist/ca.crt
      INTERNAL_TLS_CERT: /run/blacklist/tls/tls.crt
      INTERNAL_TLS_KEY: /run/blacklist/tls/tls.key
      COLLECTOR_URL: https://blacklist-collector:8545
      COLLECTOR_COLLECTION_TIMEOUT: ${COLLECTOR_COLLECTION_TIMEOUT:-360}
      BLACKLIST_API_URL: https://blacklist-app:2542/api
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?CREDENTIAL_MASTER_KEY is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      COLLECTOR_AUTH_TOKEN: ${COLLECTOR_AUTH_TOKEN:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?ENCRYPTION_SALT is required}
      # Generated on the TARGET host by install.sh and never shipped in the bundle.
      # Without these the app falls back to a login it can never satisfy.
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - blacklist-logs:/app/logs
      - blacklist-uploads:/app/uploads
      - blacklist-app-data:/app/data
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/ca/ca.crt:/run/blacklist/ca.crt:ro
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/app:/run/blacklist/tls:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "--cacert", "/run/blacklist/ca.crt", "https://blacklist-app:2542/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  blacklist-frontend:
    container_name: blacklist-frontend
    restart: unless-stopped
    networks:
      - blacklist-net
    ports:
      - "443:3000"
    depends_on:
      blacklist-app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://blacklist-app:2542
      INTERNAL_CA_CERT: /run/blacklist/ca.crt
      NODE_OPTIONS: --require=/run/blacklist/frontend-internal-tls.cjs
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Seoul
    volumes:
      - ${BLACKLIST_TLS_DIR:-/etc/blacklist/tls}/ca/ca.crt:/run/blacklist/ca.crt:ro
      - ./frontend-internal-tls.cjs:/run/blacklist/frontend-internal-tls.cjs:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const http=require('http');const https=require('https');
          http.get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1)})
          .on('error',()=>{https.get({hostname:'localhost',port:3000,path:'/health',
          rejectUnauthorized:false},r=>{process.exit(r.statusCode===200?0:1)})
          .on('error',()=>process.exit(1))})"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  blacklist-pgdata:
  blacklist-redis-data:
  blacklist-collector-data:
  blacklist-logs:
  blacklist-uploads:
  blacklist-app-data:

networks:
  blacklist-net:
    driver: bridge
