[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require services)",
    "security: Security-related tests",
    "db: Database tests",
    "api: API endpoint tests",
]
addopts = "-v --tb=short --ignore=tests/unit/collector"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W291", "W293"]

[tool.ruff.lint.per-file-ignores]
"app/core/routes/api/__init__.py" = ["E402", "F401"]
"app/core/routes/api/blacklist/__init__.py" = ["F401", "E402"]
"app/core/routes/api/collection/__init__.py" = ["F401", "E402"]
"app/core/routes/api/fortinet/__init__.py" = ["F401", "E402"]
"app/core/schemas/__init__.py" = ["F401", "F403"]
"app/core/utils/__init__.py" = ["F401", "F403"]
"app/core/services/*.py" = ["E402"]
