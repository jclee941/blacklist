# Consolidated Release Pipeline
# Replaces: release.yml (sequential, no validation) + release-new.yml (self-hosted only)
# Adds: VERSION/tag validation, matrix builds, GHCR push, dry_run, Slack notify
# Runner: Set vars.RUNNER to 'self-hosted' in repo settings for self-hosted runner
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build & package only, skip release/push"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract and validate version
        id: version
        run: |
          VERSION=$(cat VERSION)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION is not a valid semantic version"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" != "$TAG_VERSION" ]]; then
              echo "::error::VERSION file (${VERSION}) does not match tag (${TAG_VERSION})"
              exit 1
            fi
          fi
      - name: Check CHANGELOG
        run: |
          VERSION=$(cat VERSION)
          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md 2>/dev/null; then
            echo "::error::No CHANGELOG.md entry found for version ${VERSION}"
            exit 1
          fi
      - name: Check release notes
        run: |
          VERSION=$(cat VERSION)
          RELEASE_NOTES_FILE="docs/manual/blacklist-${VERSION}-release-notes.md"
          if [[ ! -f "$RELEASE_NOTES_FILE" ]]; then
            echo "::error::Release notes file not found: ${RELEASE_NOTES_FILE}"
            exit 1
          fi
          if [[ ! -s "$RELEASE_NOTES_FILE" ]]; then
            echo "::error::Release notes file is empty: ${RELEASE_NOTES_FILE}"
            exit 1
          fi

  build-images:
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      push: false

  test-release:
    needs: validate
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: blacklist
          POSTGRES_PASSWORD: blacklist
          POSTGRES_DB: blacklist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U blacklist"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://blacklist:blacklist@localhost:5432/blacklist_test
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: blacklist_test
      POSTGRES_USER: blacklist
      POSTGRES_PASSWORD: blacklist
      PYTHONPATH: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r app/requirements-dev.txt -r collector/requirements.txt
      - working-directory: frontend
        run: npm ci
      - run: make test

  scan-release-images:
    needs: [validate, build-images]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, app, collector, postgres, redis]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.service }}
      - name: Load image
        run: gunzip -c blacklist-${{ matrix.service }}.tar.gz | docker load
      - name: Scan publishable image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: blacklist-${{ matrix.service }}:${{ needs.validate.outputs.version }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-files: ${{ matrix.service == 'postgres' && 'usr/local/bin/gosu' || '' }}

  e2e-release:
    needs: [validate, build-images]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
      - name: Load release images
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for service in frontend app collector postgres redis; do
            gunzip -c "blacklist-${service}.tar.gz" | docker load
            docker tag "blacklist-${service}:${RELEASE_VERSION}" "blacklist-${service}:ci"
          done
      - name: Prepare release E2E environment
        run: |
          CI_ENV_FILE="$RUNNER_TEMP/blacklist-release-e2e.env"
          BLACKLIST_TLS_DIR="$RUNNER_TEMP/blacklist-release-e2e-tls"
          BLACKLIST_FRONTEND_TLS_DIR="$RUNNER_TEMP/blacklist-release-e2e-frontend-tls"
          ADMIN_PASSWORD=$(openssl rand -hex 24)
          printf '::add-mask::%s\n' "$ADMIN_PASSWORD"
          printf 'CI_ENV_FILE=%s\nBLACKLIST_TLS_DIR=%s\nBLACKLIST_FRONTEND_TLS_DIR=%s\nE2E_USERNAME=admin\nE2E_PASSWORD=%s\n' \
            "$CI_ENV_FILE" "$BLACKLIST_TLS_DIR" "$BLACKLIST_FRONTEND_TLS_DIR" "$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          cat > "$CI_ENV_FILE" <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          APP_DB_USER=blacklist_app
          APP_DB_PASSWORD=$(openssl rand -hex 24)
          COLLECTOR_DB_USER=blacklist_collector
          COLLECTOR_DB_PASSWORD=$(openssl rand -hex 24)
          REDIS_PASSWORD=$(openssl rand -hex 24)
          SECRET_KEY=$(openssl rand -hex 32)
          FLASK_SECRET_KEY=$(openssl rand -hex 32)
          JWT_SECRET_KEY=$(openssl rand -hex 32)
          CREDENTIAL_MASTER_KEY=$(openssl rand -hex 32)
          CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32)
          SETTINGS_ENCRYPTION_KEY=$(openssl rand -base64 32)
          ENCRYPTION_SALT=$(openssl rand -hex 32)
          COLLECTOR_AUTH_TOKEN=$(openssl rand -hex 32)
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD=$ADMIN_PASSWORD
          BLACKLIST_TLS_DIR=$RUNNER_TEMP/blacklist-release-e2e-tls
          BLACKLIST_FRONTEND_TLS_DIR=$RUNNER_TEMP/blacklist-release-e2e-frontend-tls
          FRONTEND_TLS_MODE=self-signed
          FRONTEND_BIND_ADDRESS=127.0.0.1
          TRUSTED_PROXY_NETWORKS=172.30.0.10/32
          EOF
          sudo install -d -m 700 -o 1001 -g 1001 "$BLACKLIST_FRONTEND_TLS_DIR"
          sudo env BLACKLIST_TLS_DIR="$BLACKLIST_TLS_DIR" bash deploy/install.sh --generate-tls-only
      - name: Start release services
        run: docker compose --env-file "$CI_ENV_FILE" -f deploy/base.yml -f .github/docker-compose.ci.yml up -d --wait --wait-timeout 240
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: Run release E2E
        working-directory: frontend
        run: npm run test:e2e
        env:
          BASE_URL: https://localhost:3443
          API_URL: https://localhost:3443
          E2E_USERNAME: ${{ env.E2E_USERNAME }}
          E2E_PASSWORD: ${{ env.E2E_PASSWORD }}
          WEBKIT_ENABLED: "true"
      - if: always()
        run: |
          docker compose --env-file "$CI_ENV_FILE" -f deploy/base.yml -f .github/docker-compose.ci.yml down -v
          sudo rm -rf "$BLACKLIST_TLS_DIR" "$BLACKLIST_FRONTEND_TLS_DIR"
          rm -f "$CI_ENV_FILE"

  package:
    needs: [validate, build-images]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Create release bundle
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          BUNDLE="blacklist-${VERSION}"

          # Reuse the single packaging implementation. Hand-rolling the bundle
          # here previously omitted MANIFEST.sha256 and every relative bind-mount
          # source in base.yml, and install.sh treats both as fatal, so a
          # CI-produced bundle could not be installed.
          mkdir -p "release/${BUNDLE}/images"
          cp -- images/*.tar.gz "release/${BUNDLE}/images/"
          python scripts/build_offline_bundle.py --output release --skip-images

          mv "release/${BUNDLE}.tar.gz" "release/${BUNDLE}.tar.gz.sha256" .
      - name: Sign release artifacts
        env:
          GNUPGHOME: ${{ runner.temp }}/blacklist-release-gnupg
          RELEASE_GPG_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [[ -z "$RELEASE_GPG_PRIVATE_KEY" || -z "$RELEASE_GPG_FINGERPRINT" ]]; then
            echo "::error::RELEASE_GPG_PRIVATE_KEY and RELEASE_GPG_FINGERPRINT are required"
            exit 1
          fi
          TRACKED_FINGERPRINT=$(tr -d '[:space:]' < docs/manual/blacklist-release-signing-key-v1.fingerprint)
          if [[ "$RELEASE_GPG_FINGERPRINT" != "$TRACKED_FINGERPRINT" ]]; then
            echo "::error::RELEASE_GPG_FINGERPRINT does not match the tracked release identity"
            exit 1
          fi
          install -d -m 700 "$GNUPGHOME"
          cleanup_gnupg() {
            gpgconf --kill all || true
            rm -rf -- "$GNUPGHOME"
          }
          trap cleanup_gnupg EXIT
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          if ! gpg --batch --with-colons --list-secret-keys --fingerprint \
            | awk -F: '$1 == "fpr" { print $10 }' \
            | grep -Fxq "$RELEASE_GPG_FINGERPRINT"; then
            echo "::error::Imported signing key does not match RELEASE_GPG_FINGERPRINT"
            exit 1
          fi
          sign_file() {
            local source_path="$1"
            local signature_path="$2"
            if [[ -n "$RELEASE_GPG_PASSPHRASE" ]]; then
              printf '%s' "$RELEASE_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
                --passphrase-fd 0 --local-user "$RELEASE_GPG_FINGERPRINT" \
                --armor --detach-sign --output "$signature_path" "$source_path"
            else
              gpg --batch --yes --local-user "$RELEASE_GPG_FINGERPRINT" \
                --armor --detach-sign --output "$signature_path" "$source_path"
            fi
          }
          BUNDLE="blacklist-${RELEASE_VERSION}"
          rm -rf release-signed
          mkdir release-signed
          tar -xzf "${BUNDLE}.tar.gz" -C release-signed
          sign_file \
            "release-signed/${BUNDLE}/MANIFEST.sha256" \
            "release-signed/${BUNDLE}/MANIFEST.sha256.asc"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "${BUNDLE}.tar.gz" -C release-signed "${BUNDLE}"
          sha256sum "${BUNDLE}.tar.gz" > "${BUNDLE}.tar.gz.sha256"
          sign_file "${BUNDLE}.tar.gz" "${BUNDLE}.tar.gz.asc"
          cp docs/manual/blacklist-release-signing-key-v1.asc "${BUNDLE}-release-public-key.asc"
          cp docs/manual/blacklist-release-signing-key-v1.fingerprint "${BUNDLE}-release-key.fingerprint"
          cp "docs/manual/blacklist-${RELEASE_VERSION}-release-notes.md" "${BUNDLE}-release-notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            blacklist-*.tar.gz
            blacklist-*.tar.gz.asc
            blacklist-*.tar.gz.sha256
            blacklist-*-release-key.fingerprint
            blacklist-*-release-notes.md
            blacklist-*-release-public-key.asc
          retention-days: 30

  release-gate:
    needs: [validate, test-release, scan-release-images, e2e-release, package]
    if: always() && !cancelled()
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all release checks
        run: |
          results=(
            "validate=${{ needs.validate.result }}"
            "test-release=${{ needs.test-release.result }}"
            "scan-release-images=${{ needs.scan-release-images.result }}"
            "e2e-release=${{ needs.e2e-release.result }}"
            "package=${{ needs.package.result }}"
          )
          for result in "${results[@]}"; do
            if [ "${result##*=}" != "success" ]; then
              echo "::error::Release gate failed: $result"
              exit 1
            fi
          done

  create-release:
    needs: [validate, package, release-gate]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      !inputs.dry_run &&
      needs.release-gate.result == 'success'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          BUNDLE="blacklist-${RELEASE_VERSION}"
          gh release create "$RELEASE_TAG" \
            --title "Release $RELEASE_VERSION" \
            --notes-file "${BUNDLE}-release-notes.md" \
            blacklist-*.tar.gz \
            blacklist-*.tar.gz.asc \
            blacklist-*.tar.gz.sha256 \
            blacklist-*-release-key.fingerprint \
            blacklist-*-release-notes.md \
            blacklist-*-release-public-key.asc
  push-to-registry:
    needs: [validate, build-images, release-gate]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      !inputs.dry_run &&
      needs.release-gate.result == 'success'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: production
    permissions:
      packages: write
    strategy:
      matrix:
        service: [frontend, app, collector, postgres, redis]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.service }}
      - name: Load image
        run: gunzip -c blacklist-${{ matrix.service }}.tar.gz | docker load
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push to GHCR
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          IMAGE="ghcr.io/${{ github.repository }}/blacklist-${{ matrix.service }}"
          docker tag "blacklist-${{ matrix.service }}:${VERSION}" "${IMAGE}:${VERSION}"
          docker tag "blacklist-${{ matrix.service }}:${VERSION}" "${IMAGE}:latest"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

  notify:
    needs: [validate, create-release, push-to-registry]
    if: always() && !cancelled()
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Slack notification
        if: vars.SLACK_WEBHOOK_URL != ''
        run: |
          STATUS="${{ contains(needs.*.result, 'failure') && ':x: Failed' || ':white_check_mark: Success' }}"
          curl -fsS -X POST "${{ vars.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{\"text\": \"Blacklist ${{ needs.validate.outputs.version }} release ${{ contains(needs.*.result, 'failure') && 'FAILED' || 'completed' }}\", \"blocks\": [{\"type\": \"section\", \"text\": {\"type\": \"mrkdwn\", \"text\": \"*Blacklist Release ${{ needs.validate.outputs.version }}*\\nStatus: ${STATUS}\\n<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}|View Release>\"}}]}"
