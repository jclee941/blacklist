# Consolidated Release Pipeline
# Replaces: release.yml (sequential, no validation) + release-new.yml (self-hosted only)
# Adds: VERSION/tag validation, matrix builds, GHCR push, dry_run, Slack notify
# Runner: Set vars.RUNNER to 'self-hosted' in repo settings for self-hosted runner
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build & package only, skip release/push"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Extract and validate version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" != "$TAG_VERSION" ]]; then
              echo "::error::VERSION file (${VERSION}) does not match tag (${TAG_VERSION})"
              exit 1
            fi
          fi
      - name: Check CHANGELOG
        run: |
          VERSION=$(cat VERSION)
          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md 2>/dev/null; then
            echo "::error::No CHANGELOG.md entry found for version ${VERSION}"
            exit 1
          fi

  build-images:
    needs: validate
    uses: ./.github/workflows/build-images.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      push: false
    secrets: inherit

  package:
    needs: [validate, build-images]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - name: Create release bundle
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          BUNDLE="blacklist-${VERSION}"
          mkdir -p "${BUNDLE}/images"

          cp images/*.tar.gz "${BUNDLE}/images/"

          # Copy release bundle files
          cp deploy/docker-compose.release.yml "${BUNDLE}/docker-compose.yml"
          cp deploy/base.yml "${BUNDLE}/"
          cp deploy/install.sh "${BUNDLE}/"
          cp -r deploy/prereqs "${BUNDLE}/" 2>/dev/null || true

          if [ -f "${BUNDLE}/install.sh" ]; then
            sed -i "s/^VERSION=.*/VERSION=${VERSION}/" "${BUNDLE}/install.sh"
          fi

          echo "${VERSION}" > "${BUNDLE}/VERSION"

          cd "${BUNDLE}/images" && sha256sum *.tar.gz > checksums.sha256 && cd ../..
          tar czf "${BUNDLE}.tar.gz" "${BUNDLE}/"
          sha256sum "${BUNDLE}.tar.gz" > "${BUNDLE}.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            blacklist-*.tar.gz
            blacklist-*.tar.gz.sha256
          retention-days: 30

  create-release:
    needs: [validate, package]
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1;next} /^## \[/{if(found)exit} found{print}" CHANGELOG.md 2>/dev/null || echo "Release ${VERSION}")
          {
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ needs.validate.outputs.version }}" \
            --notes "${{ steps.changelog.outputs.notes }}" \
            blacklist-*.tar.gz \
            blacklist-*.tar.gz.sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  push-to-registry:
    needs: [validate, build-images]
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: production
    permissions:
      packages: write
    strategy:
      matrix:
        service: [frontend, app, collector, postgres, redis]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.service }}
      - name: Load image
        run: gunzip -c blacklist-${{ matrix.service }}.tar.gz | docker load
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push to GHCR
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          IMAGE="ghcr.io/${{ github.repository }}/blacklist-${{ matrix.service }}"
          docker tag "blacklist-${{ matrix.service }}:${VERSION}" "${IMAGE}:${VERSION}"
          docker tag "blacklist-${{ matrix.service }}:${VERSION}" "${IMAGE}:latest"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

  notify:
    needs: [validate, create-release, push-to-registry]
    if: always() && !cancelled()
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Slack notification
        if: vars.SLACK_WEBHOOK_URL != ''
        run: |
          STATUS="${{ contains(needs.*.result, 'failure') && ':x: Failed' || ':white_check_mark: Success' }}"
          curl -fsS -X POST "${{ vars.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{\"text\": \"Blacklist ${{ needs.validate.outputs.version }} release ${{ contains(needs.*.result, 'failure') && 'FAILED' || 'completed' }}\", \"blocks\": [{\"type\": \"section\", \"text\": {\"type\": \"mrkdwn\", \"text\": \"*Blacklist Release ${{ needs.validate.outputs.version }}*\\nStatus: ${STATUS}\\n<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}|View Release>\"}}]}"
