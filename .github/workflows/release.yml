# Consolidated Release Pipeline
# Replaces: release.yml (sequential, no validation) + release-new.yml (self-hosted only)
# Adds: VERSION/tag validation, matrix builds, GHCR push, dry_run, Slack notify
# Runner: Set vars.RUNNER to 'self-hosted' in repo settings for self-hosted runner
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build & package only, skip release/push"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract and validate version
        id: version
        run: |
          VERSION=$(cat VERSION)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION is not a valid semantic version"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" != "$TAG_VERSION" ]]; then
              echo "::error::VERSION file (${VERSION}) does not match tag (${TAG_VERSION})"
              exit 1
            fi
          fi
      - name: Check CHANGELOG
        run: |
          VERSION=$(cat VERSION)
          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md 2>/dev/null; then
            echo "::error::No CHANGELOG.md entry found for version ${VERSION}"
            exit 1
          fi
      - name: Check release notes
        run: |
          VERSION=$(cat VERSION)
          RELEASE_NOTES_FILE="docs/manual/blacklist-${VERSION}-release-notes.md"
          if [[ ! -f "$RELEASE_NOTES_FILE" ]]; then
            echo "::error::Release notes file not found: ${RELEASE_NOTES_FILE}"
            exit 1
          fi
          if [[ ! -s "$RELEASE_NOTES_FILE" ]]; then
            echo "::error::Release notes file is empty: ${RELEASE_NOTES_FILE}"
            exit 1
          fi

  build-images:
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      push: false

  package:
    needs: [validate, build-images]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Create release bundle
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          BUNDLE="blacklist-${VERSION}"

          # Reuse the single packaging implementation. Hand-rolling the bundle
          # here previously omitted MANIFEST.sha256 and every relative bind-mount
          # source in base.yml, and install.sh treats both as fatal, so a
          # CI-produced bundle could not be installed.
          mkdir -p "release/${BUNDLE}/images"
          cp -- images/*.tar.gz "release/${BUNDLE}/images/"
          python scripts/build_offline_bundle.py --output release --skip-images

          mv "release/${BUNDLE}.tar.gz" "release/${BUNDLE}.tar.gz.sha256" .
      - name: Sign release artifacts
        env:
          GNUPGHOME: ${{ runner.temp }}/blacklist-release-gnupg
          RELEASE_GPG_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [[ -z "$RELEASE_GPG_PRIVATE_KEY" || -z "$RELEASE_GPG_FINGERPRINT" ]]; then
            echo "::error::RELEASE_GPG_PRIVATE_KEY and RELEASE_GPG_FINGERPRINT are required"
            exit 1
          fi
          install -d -m 700 "$GNUPGHOME"
          cleanup_gnupg() {
            gpgconf --kill all || true
            rm -rf -- "$GNUPGHOME"
          }
          trap cleanup_gnupg EXIT
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          if ! gpg --batch --with-colons --list-secret-keys --fingerprint \
            | awk -F: '$1 == "fpr" { print $10 }' \
            | grep -Fxq "$RELEASE_GPG_FINGERPRINT"; then
            echo "::error::Imported signing key does not match RELEASE_GPG_FINGERPRINT"
            exit 1
          fi
          sign_file() {
            local source_path="$1"
            local signature_path="$2"
            if [[ -n "$RELEASE_GPG_PASSPHRASE" ]]; then
              printf '%s' "$RELEASE_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
                --passphrase-fd 0 --local-user "$RELEASE_GPG_FINGERPRINT" \
                --armor --detach-sign --output "$signature_path" "$source_path"
            else
              gpg --batch --yes --local-user "$RELEASE_GPG_FINGERPRINT" \
                --armor --detach-sign --output "$signature_path" "$source_path"
            fi
          }
          BUNDLE="blacklist-${RELEASE_VERSION}"
          rm -rf release-signed
          mkdir release-signed
          tar -xzf "${BUNDLE}.tar.gz" -C release-signed
          sign_file \
            "release-signed/${BUNDLE}/MANIFEST.sha256" \
            "release-signed/${BUNDLE}/MANIFEST.sha256.asc"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "${BUNDLE}.tar.gz" -C release-signed "${BUNDLE}"
          sha256sum "${BUNDLE}.tar.gz" > "${BUNDLE}.tar.gz.sha256"
          sign_file "${BUNDLE}.tar.gz" "${BUNDLE}.tar.gz.asc"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            blacklist-*.tar.gz
            blacklist-*.tar.gz.asc
            blacklist-*.tar.gz.sha256
          retention-days: 30

  create-release:
    needs: [validate, package]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !inputs.dry_run }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
      - name: Extract changelog
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          awk -v version="$VERSION" '
            $0 == "## [" version "]" { found=1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            printf 'Release %s\n' "$VERSION" > release-notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "Release $RELEASE_VERSION" \
            --notes-file release-notes.md \
            blacklist-*.tar.gz \
            blacklist-*.tar.gz.asc \
            blacklist-*.tar.gz.sha256
  push-to-registry:
    needs: [validate, build-images]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !inputs.dry_run }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: production
    permissions:
      packages: write
    strategy:
      matrix:
        service: [frontend, app, collector, postgres, redis]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.service }}
      - name: Load image
        run: gunzip -c blacklist-${{ matrix.service }}.tar.gz | docker load
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push to GHCR
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          IMAGE="ghcr.io/${{ github.repository }}/blacklist-${{ matrix.service }}"
          docker tag "blacklist-${{ matrix.service }}:${VERSION}" "${IMAGE}:${VERSION}"
          docker tag "blacklist-${{ matrix.service }}:${VERSION}" "${IMAGE}:latest"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

  notify:
    needs: [validate, create-release, push-to-registry]
    if: always() && !cancelled()
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Slack notification
        if: vars.SLACK_WEBHOOK_URL != ''
        run: |
          STATUS="${{ contains(needs.*.result, 'failure') && ':x: Failed' || ':white_check_mark: Success' }}"
          curl -fsS -X POST "${{ vars.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{\"text\": \"Blacklist ${{ needs.validate.outputs.version }} release ${{ contains(needs.*.result, 'failure') && 'FAILED' || 'completed' }}\", \"blocks\": [{\"type\": \"section\", \"text\": {\"type\": \"mrkdwn\", \"text\": \"*Blacklist Release ${{ needs.validate.outputs.version }}*\\nStatus: ${STATUS}\\n<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}|View Release>\"}}]}"
