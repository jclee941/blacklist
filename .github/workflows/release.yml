# Consolidated Release Pipeline
# Replaces: release.yml (sequential, no validation) + release-new.yml (self-hosted only)
# Adds: VERSION/tag validation, matrix builds, GHCR push, dry_run, Slack notify
# Runner: Set vars.RUNNER to 'self-hosted' in repo settings for self-hosted runner
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build & package only, skip release/push'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract and validate version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" != "$TAG_VERSION" ]]; then
              echo "::error::VERSION file (${VERSION}) does not match tag (${TAG_VERSION})"
              exit 1
            fi
          fi
      - name: Check CHANGELOG
        run: |
          VERSION=$(cat VERSION)
          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md 2>/dev/null; then
            echo "::warning::No CHANGELOG.md entry found for version ${VERSION}"
          fi

  build-images:
    needs: validate
    uses: ./.github/workflows/build-images.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      push: false
    secrets: inherit

  package-airgap:
    needs: [validate, build-images]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - name: Create airgap bundle
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          BUNDLE="blacklist-airgap-${VERSION}"
          mkdir -p "${BUNDLE}/images"

          cp images/*.tar.gz "${BUNDLE}/images/"
          cp -r deploy/airgap/* "${BUNDLE}/" 2>/dev/null || true

          if [ -f "${BUNDLE}/install.sh" ]; then
            sed -i "s/^VERSION=.*/VERSION=${VERSION}/" "${BUNDLE}/install.sh"
          fi

          cd "${BUNDLE}/images" && sha256sum *.tar.gz > checksums.sha256 && cd ../..
          tar czf "${BUNDLE}.tar.gz" "${BUNDLE}/"
          sha256sum "${BUNDLE}.tar.gz" > "${BUNDLE}.tar.gz.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: airgap-bundle
          path: |
            blacklist-airgap-*.tar.gz
            blacklist-airgap-*.tar.gz.sha256
          retention-days: 30

  create-release:
    needs: [validate, package-airgap]
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: airgap-bundle
      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1;next} /^## \[/{if(found)exit} found{print}" CHANGELOG.md 2>/dev/null || echo "Release ${VERSION}")
          {
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ needs.validate.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            blacklist-airgap-*.tar.gz
            blacklist-airgap-*.tar.gz.sha256
          draft: false
          prerelease: false

  push-to-registry:
    needs: [validate, build-images]
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      packages: write
    strategy:
      matrix:
        service: [frontend, app, collector, postgres, redis]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: image-${{ matrix.service }}
      - name: Load image
        run: gunzip -c blacklist-${{ matrix.service }}.tar.gz | docker load
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push to GHCR
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          IMAGE="ghcr.io/${{ github.repository }}/blacklist-${{ matrix.service }}"
          docker tag "blacklist-${{ matrix.service }}:${VERSION}" "${IMAGE}:${VERSION}"
          docker tag "blacklist-${{ matrix.service }}:${VERSION}" "${IMAGE}:latest"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

  trigger-sandbox-update:
    name: Trigger Sandbox Auto-Update
    needs: [push-to-registry]
    if: ${{ !inputs.dry_run }}
    # Requires a self-hosted runner with the 'deploy' label registered in repo/org settings
    runs-on: ${{ vars.DEPLOY_RUNNER || 'self-hosted' }}
    continue-on-error: true
    steps:
      - name: Trigger Watchtower on Sandbox
        env:
          SANDBOX_HOST: 192.168.50.220
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
        run: |
          if [ -z "${WATCHTOWER_TOKEN}" ]; then
            echo "⚠️ WATCHTOWER_TOKEN secret not set — skipping"
            exit 0
          fi

          echo "🔄 Triggering Watchtower update on ${SANDBOX_HOST}..."
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${WATCHTOWER_TOKEN}" \
            "http://${SANDBOX_HOST}:8080/v1/update" 2>/dev/null || echo "000")

          if [ "${HTTP_CODE}" = "200" ]; then
            echo "✅ Watchtower triggered — sandbox will pull :latest images"
          else
            echo "⚠️ Watchtower trigger returned HTTP ${HTTP_CODE} (non-blocking)"
          fi

  notify:
    needs: [validate, create-release, push-to-registry, trigger-sandbox-update]
    if: always()
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Slack notification
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "Blacklist ${{ needs.validate.outputs.version }} release ${{ contains(needs.*.result, 'failure') && 'FAILED' || 'completed' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Blacklist Release ${{ needs.validate.outputs.version }}*\nStatus: ${{ contains(needs.*.result, 'failure') && ':x: Failed' || ':white_check_mark: Success' }}\n<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}|View Release>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
