name: Deploy to Sandbox

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (leave empty for latest release)"
        required: false
        type: string

env:
  SANDBOX_HOST: 192.168.50.220
  SANDBOX_USER: jclee
  DEPLOY_BASE: /opt/blacklist
  REGISTRY: ghcr.io

jobs:
  deploy-sandbox:
    name: Deploy to Sandbox (VM 220)
    # Requires a self-hosted runner with the 'deploy' label registered in repo/org settings
    runs-on: ${{ vars.DEPLOY_RUNNER || 'self-hosted' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # --- Determine version ---
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            LATEST=$(curl -sf -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])" 2>/dev/null || echo "")
            VERSION="${LATEST#v}"
          fi

          if [ -z "${VERSION}" ]; then
            echo "::error::Could not determine version"
            exit 1
          fi

          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "📦 Version: ${VERSION}"
          echo "📦 Registry: ${{ env.REGISTRY }}/${REPO_LC}"

      # --- GHCR Login (runner) ---
      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # --- Verify GHCR images ---
      - name: Verify images exist in GHCR
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ steps.version.outputs.repo }}
        run: |
          SERVICES="postgres redis collector app frontend"
          MISSING=0

          for svc in ${SERVICES}; do
            IMAGE="${{ env.REGISTRY }}/${REPO}/blacklist-${svc}:${VERSION}"
            if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
              echo "✅ ${IMAGE}"
            else
              echo "❌ Missing: ${IMAGE}"
              MISSING=1
            fi
          done

          if [ $MISSING -ne 0 ]; then
            echo ""
            echo "::error::One or more images not found in GHCR for v${VERSION}"
            echo "Run the release workflow first, or check the version number."
            exit 1
          fi

      # --- Setup SSH ---
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SANDBOX_SSH_KEY }}" > ~/.ssh/sandbox_key
          chmod 600 ~/.ssh/sandbox_key
          ssh-keyscan -H ${{ env.SANDBOX_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify connectivity
        run: |
          ssh -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }} \
            "echo '✅ SSH OK'; uptime; sudo docker --version; sudo docker compose version"

      - name: Upload deploy files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DEPLOY_DIR="${{ env.DEPLOY_BASE }}/blacklist-v${VERSION}"
          SSH="ssh -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no ${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }}"
          ${SSH} "sudo mkdir -p ${DEPLOY_DIR} && sudo chown -R \$(whoami):\$(whoami) ${DEPLOY_DIR}"
          scp -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no \
            deploy/sandbox/docker-compose.yml \
            deploy/sandbox/deploy.sh \
            "${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }}:${DEPLOY_DIR}/"
          ${SSH} "chmod +x ${DEPLOY_DIR}/deploy.sh"

      - name: Pull images and deploy
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ steps.version.outputs.repo }}
        run: |
          ssh -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no \
            ${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }} \
            "VERSION=${VERSION} DEPLOY_BASE=${{ env.DEPLOY_BASE }} REGISTRY=${{ env.REGISTRY }} REPO=${REPO} GHCR_PAT=${{ secrets.GHCR_PAT }} GHCR_USER=${{ github.actor }} ${{ env.DEPLOY_BASE }}/blacklist-v${VERSION}/deploy.sh"

      # --- Health check ---
      - name: Health check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          HOST=${{ env.SANDBOX_HOST }}
          echo "⏳ Waiting 20s for services to initialize..."
          sleep 20

          check_endpoint() {
            local url="$1"
            local name="$2"
            for i in $(seq 1 6); do
              if curl -sf -k --max-time 5 "${url}" > /dev/null 2>&1; then
                echo "✅ ${name} (${url})"
                return 0
              fi
              echo "  ⏳ Waiting for ${name}... (${i}/6)"
              sleep 10
            done
            echo "❌ ${name} failed (${url})"
            return 1
          }

          FAILED=0
          check_endpoint "http://${HOST}:2542/api/health" "API" || FAILED=1
          check_endpoint "http://${HOST}:8545/health" "Collector" || FAILED=1
          check_endpoint "https://${HOST}" "Frontend" || FAILED=1

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "=== Debug: Container status ==="
            ssh -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no \
              ${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }} \
              "sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' | grep blacklist || echo 'No containers found'; echo ''; for svc in app collector frontend postgres redis; do echo \"--- blacklist-\${svc} ---\"; sudo docker logs --tail 10 blacklist-\${svc} 2>&1 || true; done"
            exit 1
          fi

          echo ""
          echo "🎉 Sandbox deployment v${VERSION} successful!"

      # --- Cleanup ---
      - name: Cleanup old versions
        if: success()
        run: |
          ssh -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no \
            ${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }} << 'CLEANUP'
          DEPLOY_BASE=/opt/blacklist
          cd "${DEPLOY_BASE}" || exit 0
          CURRENT=$(readlink -f current 2>/dev/null || echo "")

          ls -dt blacklist-v*/ 2>/dev/null | tail -n +3 | while read -r dir; do
            FULL=$(readlink -f "$dir")
            if [ "$FULL" != "$CURRENT" ]; then
              echo "🗑️  Removing old version: $dir"
              sudo rm -rf "$dir"
            fi
          done

          echo "🧹 Pruning unused images..."
          sudo docker image prune -af --filter "until=168h" 2>/dev/null || true
          CLEANUP

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/sandbox_key

  notify:
    name: Notify
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    needs: [deploy-sandbox]
    if: always()
    steps:
      - name: Send notification
        if: vars.SLACK_WEBHOOK_URL
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ needs.deploy-sandbox.result }}" == "success" ]; then
            EMOJI="✅"
            STATUS="succeeded"
            COLOR="#36a64f"
          elif [ "${{ needs.deploy-sandbox.result }}" == "skipped" ]; then
            exit 0
          else
            EMOJI="❌"
            STATUS="FAILED"
            COLOR="#dc3545"
          fi

          curl -sf -X POST "${SLACK_WEBHOOK_URL}" \
            -H "Content-type: application/json" \
            -d "{
              \"attachments\": [{
                \"color\": \"${COLOR}\",
                \"text\": \"${EMOJI} *Deploy to Sandbox (220)* ${STATUS}\n• Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>\"
              }]
            }" || true
