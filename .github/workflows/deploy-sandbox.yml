name: Deploy to Sandbox

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (leave empty for latest release)"
        required: false
        type: string

env:
  SANDBOX_HOST: 192.168.50.220
  SANDBOX_USER: jclee
  DEPLOY_BASE: /opt/blacklist
  REGISTRY: ghcr.io

jobs:
  deploy-sandbox:
    name: Deploy to Sandbox (VM 220)
    runs-on: [self-hosted, deploy]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --- Determine version ---
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            LATEST=$(curl -sf -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])" 2>/dev/null || echo "")
            VERSION="${LATEST#v}"
          fi

          if [ -z "${VERSION}" ]; then
            echo "::error::Could not determine version"
            exit 1
          fi

          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "📦 Version: ${VERSION}"
          echo "📦 Registry: ${{ env.REGISTRY }}/${REPO_LC}"

      # --- GHCR Login (runner) ---
      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # --- Verify GHCR images ---
      - name: Verify images exist in GHCR
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ steps.version.outputs.repo }}
        run: |
          SERVICES="postgres redis collector app frontend"
          MISSING=0

          for svc in ${SERVICES}; do
            IMAGE="${{ env.REGISTRY }}/${REPO}/blacklist-${svc}:${VERSION}"
            if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
              echo "✅ ${IMAGE}"
            else
              echo "❌ Missing: ${IMAGE}"
              MISSING=1
            fi
          done

          if [ $MISSING -ne 0 ]; then
            echo ""
            echo "::error::One or more images not found in GHCR for v${VERSION}"
            echo "Run the release workflow first, or check the version number."
            exit 1
          fi

      # --- Setup SSH ---
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SANDBOX_SSH_KEY }}" > ~/.ssh/sandbox_key
          chmod 600 ~/.ssh/sandbox_key
          ssh-keyscan -H ${{ env.SANDBOX_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify connectivity
        run: |
          ssh -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }} \
            "echo '✅ SSH OK'; uptime; sudo docker --version; sudo docker compose version"

      # --- Upload deploy files ---
      - name: Upload compose file
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DEPLOY_DIR="${{ env.DEPLOY_BASE }}/blacklist-v${VERSION}"
          SSH="ssh -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no ${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }}"
          ${SSH} "sudo mkdir -p ${DEPLOY_DIR} && sudo chown -R \$(whoami):\$(whoami) ${DEPLOY_DIR}"
          cat deploy/sandbox/docker-compose.yml | ${SSH} "cat > ${DEPLOY_DIR}/docker-compose.yml"

          echo "✅ Deploy files uploaded to ${DEPLOY_DIR}"

      # --- Deploy ---
      - name: Pull images and deploy
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ steps.version.outputs.repo }}
        run: |
          ssh -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no \
            ${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }} << DEPLOY_SCRIPT
          set -euo pipefail

          VERSION="${VERSION}"
          DEPLOY_BASE="${{ env.DEPLOY_BASE }}"
          DEPLOY_DIR="\${DEPLOY_BASE}/blacklist-v\${VERSION}"
          REGISTRY="${{ env.REGISTRY }}"
          REPO="${REPO}"

          echo "=== Deploying Blacklist v\${VERSION} (GHCR Pull) ==="

          # --- GHCR Login ---
          echo "🔐 Docker login to GHCR..."
          echo "${{ secrets.GHCR_PAT }}" | sudo docker login "\${REGISTRY}" -u "${{ github.actor }}" --password-stdin

          # --- Pull images (always :latest for Watchtower compatibility) ---
          echo "📥 Pulling :latest images from GHCR..."
          for svc in postgres redis collector app frontend; do
            IMAGE="\${REGISTRY}/\${REPO}/blacklist-\${svc}:latest"
            echo "  Pulling \${IMAGE}..."
            sudo docker pull "\${IMAGE}"
          done

          # --- Find previous deployment (resolve symlinks to avoid self-copy) ---
          PREV_DIR=""
          if [ -L "\${DEPLOY_BASE}/current" ]; then
            RESOLVED=\$(readlink -f "\${DEPLOY_BASE}/current" 2>/dev/null || echo "")
            if [ -n "\${RESOLVED}" ] && [ "\${RESOLVED}" != "\${DEPLOY_DIR}" ]; then
              PREV_DIR="\${RESOLVED}"
            fi
          elif [ -d "\${DEPLOY_BASE}/current" ]; then
            PREV_DIR="\${DEPLOY_BASE}/current"
          fi
          if [ -z "\${PREV_DIR}" ]; then
            PREV_DIR=\$(ls -dt "\${DEPLOY_BASE}"/blacklist-v*/ 2>/dev/null | grep -v "blacklist-v\${VERSION}/" | head -1 | sed 's:/$::')
          fi
          echo "📂 Previous deployment: \${PREV_DIR:-none}"

          # --- Preserve .env ---
          if [ -n "\${PREV_DIR}" ] && [ "\${PREV_DIR}" != "\${DEPLOY_DIR}" ] && [ -f "\${PREV_DIR}/.env" ]; then
            echo "🔒 Preserving .env from \${PREV_DIR}"
            sudo cp "\${PREV_DIR}/.env" "\${DEPLOY_DIR}/.env"
          elif [ -f "\${DEPLOY_BASE}/env-backup-latest.env" ]; then
            echo "🔒 Restoring .env from backup"
            sudo cp "\${DEPLOY_BASE}/env-backup-latest.env" "\${DEPLOY_DIR}/.env"
          fi

          # --- Generate .env if missing ---
          if [ ! -f "\${DEPLOY_DIR}/.env" ] || [ ! -s "\${DEPLOY_DIR}/.env" ]; then
            echo "⚠️  No .env found — generating secrets..."
            sudo bash -c "printf '%s\n' 'FLASK_ENV=production' 'POSTGRES_PASSWORD=blacklist' 'POSTGRES_HOST=localhost' 'REDIS_HOST=localhost' 'REDIS_PORT=6379' > \${DEPLOY_DIR}/.env"
            sudo sh -c "echo \"CREDENTIAL_MASTER_KEY=\$(openssl rand -hex 32)\" >> \${DEPLOY_DIR}/.env"
            sudo sh -c "echo \"SECRET_KEY=\$(openssl rand -hex 32)\" >> \${DEPLOY_DIR}/.env"
            sudo sh -c "echo \"CREDENTIAL_ENCRYPTION_KEY=\$(python3 -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())' 2>/dev/null || openssl rand -base64 32)\" >> \${DEPLOY_DIR}/.env"
            sudo sh -c "echo \"ENCRYPTION_SALT=\$(openssl rand -hex 16)\" >> \${DEPLOY_DIR}/.env"
            echo "✅ .env generated with fresh secrets"
          fi

          # --- Backup .env ---
          sudo cp "\${DEPLOY_DIR}/.env" "\${DEPLOY_BASE}/env-backup-latest.env"

          # --- Preserve data volumes ---
          if [ -n "\${PREV_DIR}" ] && [ "\${PREV_DIR}" != "\${DEPLOY_DIR}" ] && [ -d "\${PREV_DIR}/data" ]; then
            echo "💾 Preserving data volumes from \${PREV_DIR}..."
            sudo cp -a "\${PREV_DIR}/data" "\${DEPLOY_DIR}/data" 2>/dev/null || true
          fi

          # --- Preserve SSL ---
          if [ -n "\${PREV_DIR}" ] && [ "\${PREV_DIR}" != "\${DEPLOY_DIR}" ] && [ -d "\${PREV_DIR}/ssl" ]; then
            echo "🔑 Preserving SSL certificates from \${PREV_DIR}..."
            sudo cp -a "\${PREV_DIR}/ssl" "\${DEPLOY_DIR}/ssl" 2>/dev/null || true
          fi

          # --- Stop existing deployment ---
          if [ -n "\${PREV_DIR}" ] && [ "\${PREV_DIR}" != "\${DEPLOY_DIR}" ] && [ -f "\${PREV_DIR}/docker-compose.yml" ]; then
            echo "⏹️  Stopping existing containers..."
            cd "\${PREV_DIR}"
            sudo docker compose down --timeout 30 2>/dev/null || true
          fi

          # --- Force remove named containers ---
          for svc in app collector frontend postgres redis; do
            sudo docker rm -f "blacklist-\${svc}" 2>/dev/null || true
          done

          # --- Inject GHCR env vars ---
          cd "\${DEPLOY_DIR}"
          sudo touch .env
          sudo chown \$(whoami):\$(whoami) .env
          if ! grep -q "GITHUB_REPOSITORY" .env 2>/dev/null; then
            echo "" >> .env
            echo "# --- GHCR Deploy (auto-generated) ---" >> .env
            echo "GITHUB_REPOSITORY=\${REPO}" >> .env
          fi
          sed -i '/^VERSION=/d' .env 2>/dev/null || true
          sed -i '/^REGISTRY=/d' .env 2>/dev/null || true
          echo "REGISTRY=\${REGISTRY}" >> .env

          # --- Start services ---
          echo "🚀 Starting services..."
          sudo docker compose up -d

          # --- Update symlink ---
          sudo ln -sfn "\${DEPLOY_DIR}" "\${DEPLOY_BASE}/current"

          echo "✅ Containers started"
          sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' | grep blacklist || true
          DEPLOY_SCRIPT

      # --- Health check ---
      - name: Health check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          HOST=${{ env.SANDBOX_HOST }}
          echo "⏳ Waiting 20s for services to initialize..."
          sleep 20

          check_endpoint() {
            local url="$1"
            local name="$2"
            for i in $(seq 1 6); do
              if curl -sf -k --max-time 5 "${url}" > /dev/null 2>&1; then
                echo "✅ ${name} (${url})"
                return 0
              fi
              echo "  ⏳ Waiting for ${name}... (${i}/6)"
              sleep 10
            done
            echo "❌ ${name} failed (${url})"
            return 1
          }

          FAILED=0
          check_endpoint "http://${HOST}:2542/api/health" "API" || FAILED=1
          check_endpoint "http://${HOST}:8545/health" "Collector" || FAILED=1
          check_endpoint "http://${HOST}:443" "Frontend" || FAILED=1

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "=== Debug: Container status ==="
            ssh -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no \
              ${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }} \
              "sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' | grep blacklist || echo 'No containers found'; echo ''; for svc in app collector frontend postgres redis; do echo \"--- blacklist-\${svc} ---\"; sudo docker logs --tail 10 blacklist-\${svc} 2>&1 || true; done"
            exit 1
          fi

          echo ""
          echo "🎉 Sandbox deployment v${VERSION} successful!"

      # --- Cleanup ---
      - name: Cleanup old versions
        if: success()
        run: |
          ssh -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no \
            ${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }} << 'CLEANUP'
          DEPLOY_BASE=/opt/blacklist
          cd "${DEPLOY_BASE}" || exit 0
          CURRENT=$(readlink -f current 2>/dev/null || echo "")

          ls -dt blacklist-v*/ 2>/dev/null | tail -n +3 | while read -r dir; do
            FULL=$(readlink -f "$dir")
            if [ "$FULL" != "$CURRENT" ]; then
              echo "🗑️  Removing old version: $dir"
              sudo rm -rf "$dir"
            fi
          done

          echo "🧹 Pruning unused images..."
          sudo docker image prune -af --filter "until=168h" 2>/dev/null || true
          CLEANUP

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/sandbox_key

  notify:
    name: Notify
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    needs: [deploy-sandbox]
    if: always()
    steps:
      - name: Send notification
        if: vars.SLACK_WEBHOOK_URL
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ needs.deploy-sandbox.result }}" == "success" ]; then
            EMOJI="✅"
            STATUS="succeeded"
            COLOR="#36a64f"
          elif [ "${{ needs.deploy-sandbox.result }}" == "skipped" ]; then
            exit 0
          else
            EMOJI="❌"
            STATUS="FAILED"
            COLOR="#dc3545"
          fi

          curl -sf -X POST "${SLACK_WEBHOOK_URL}" \
            -H "Content-type: application/json" \
            -d "{
              \"attachments\": [{
                \"color\": \"${COLOR}\",
                \"text\": \"${EMOJI} *Deploy to Sandbox (220)* ${STATUS}\n• Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>\"
              }]
            }" || true
