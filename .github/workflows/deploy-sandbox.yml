name: Deploy to Sandbox

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (leave empty for latest release)'
        required: false
        type: string

env:
  SANDBOX_HOST: 192.168.50.220
  SANDBOX_USER: jclee
  DEPLOY_BASE: /opt/blacklist

jobs:
  deploy-sandbox:
    name: Deploy to Sandbox (VM 220)
    runs-on: [self-hosted, deploy]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(gh release list --limit 1 --json tagName -q '.[0].tagName' | sed 's/^v//')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 Deploying version: ${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release bundle
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p ./bundle
          gh release download "v${VERSION}" \
            --pattern "blacklist-airgap-v${VERSION}.tar.gz" \
            --dir ./bundle || {
              echo "❌ Failed to download release v${VERSION}"
              echo "Available releases:"
              gh release list --limit 5
              exit 1
            }
          ls -lh ./bundle/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SANDBOX_SSH_KEY }}" > ~/.ssh/sandbox_key
          chmod 600 ~/.ssh/sandbox_key
          ssh-keyscan -H ${{ env.SANDBOX_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify sandbox connectivity
        run: |
          ssh -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }} \
            "echo '✅ SSH connection OK'; uptime; sudo docker --version"

      - name: Upload bundle to sandbox
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "📤 Uploading airgap bundle..."
          scp -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no \
            ./bundle/blacklist-airgap-v${VERSION}.tar.gz \
            ${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }}:/tmp/
          echo "✅ Upload complete"

      - name: Deploy on sandbox
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DEPLOY_BASE=${{ env.DEPLOY_BASE }}

          ssh -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no \
            ${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }} \
            "VERSION=${VERSION} DEPLOY_BASE=${DEPLOY_BASE} bash -s" << 'DEPLOY_SCRIPT'
          set -euo pipefail

          DEPLOY_DIR="${DEPLOY_BASE}/blacklist-v${VERSION}"
          echo "=== Deploying Blacklist v${VERSION} to sandbox ==="

          # --- Extract bundle ---
          echo "📦 Extracting bundle..."
          sudo mkdir -p "${DEPLOY_DIR}"
          sudo tar xzf "/tmp/blacklist-airgap-v${VERSION}.tar.gz" -C "${DEPLOY_DIR}"
          sudo chown -R "$(whoami):$(whoami)" "${DEPLOY_DIR}"

          # --- Update deploy files from bundle ---
          cd "${DEPLOY_DIR}"

          # --- Preserve .env from previous deployment ---
          if [ -f "${DEPLOY_BASE}/current/.env" ]; then
            echo "🔒 Preserving existing .env"
            cp "${DEPLOY_BASE}/current/.env" "${DEPLOY_DIR}/.env"
          elif [ -f "${DEPLOY_BASE}/env-backup-latest.env" ]; then
            echo "🔒 Restoring .env from backup"
            cp "${DEPLOY_BASE}/env-backup-latest.env" "${DEPLOY_DIR}/.env"
          fi

          # --- Backup current .env ---
          if [ -f "${DEPLOY_DIR}/.env" ]; then
            cp "${DEPLOY_DIR}/.env" "${DEPLOY_BASE}/env-backup-latest.env"
          fi

          # --- Preserve data volumes ---
          if [ -d "${DEPLOY_BASE}/current/data" ]; then
            echo "💾 Preserving data volumes..."
            cp -a "${DEPLOY_BASE}/current/data" "${DEPLOY_DIR}/data" 2>/dev/null || true
          fi

          # --- Stop existing deployment ---
          if [ -f "${DEPLOY_BASE}/current/docker-compose.yml" ]; then
            echo "⏹️  Stopping existing containers..."
            cd "${DEPLOY_BASE}/current"
            sudo docker compose down --timeout 30 2>/dev/null || true
          fi

          # --- Force remove named containers ---
          for svc in app collector frontend postgres redis; do
            sudo docker rm -f "blacklist-${svc}" 2>/dev/null || true
          done

          # --- Install ---
          echo "🚀 Running install.sh..."
          cd "${DEPLOY_DIR}"
          sudo bash install.sh --skip-ssl

          # --- Update current symlink ---
          sudo ln -sfn "${DEPLOY_DIR}" "${DEPLOY_BASE}/current"

          # --- Cleanup ---
          rm -f "/tmp/blacklist-airgap-v${VERSION}.tar.gz"

          echo "✅ Deployment complete"
          DEPLOY_SCRIPT

      - name: Health check
        run: |
          HOST=${{ env.SANDBOX_HOST }}
          echo "⏳ Waiting 30s for services to start..."
          sleep 30

          check_endpoint() {
            local url="$1"
            local name="$2"
            for i in $(seq 1 6); do
              if curl -sf -k --max-time 5 "${url}" > /dev/null 2>&1; then
                echo "✅ ${name} (${url})"
                return 0
              fi
              echo "  ⏳ Waiting for ${name}... (${i}/6)"
              sleep 10
            done
            echo "❌ ${name} failed (${url})"
            return 1
          }

          FAILED=0
          check_endpoint "http://${HOST}:2542/api/health" "API" || FAILED=1
          check_endpoint "http://${HOST}:8545/health" "Collector" || FAILED=1
          check_endpoint "https://${HOST}:443" "Frontend" || FAILED=1

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "=== Debug: Container status ==="
            ssh -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no \
              ${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }} \
              "sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep blacklist || echo 'No blacklist containers found'"
            exit 1
          fi

          echo ""
          echo "🎉 Sandbox deployment v${{ steps.version.outputs.version }} successful!"

      - name: Cleanup old sandbox versions
        if: success()
        run: |
          ssh -i ~/.ssh/sandbox_key -o StrictHostKeyChecking=no \
            ${{ env.SANDBOX_USER }}@${{ env.SANDBOX_HOST }} \
            "DEPLOY_BASE=${{ env.DEPLOY_BASE }} bash -s" << 'CLEANUP'
          # Keep current + 1 previous version
          cd "${DEPLOY_BASE}" || exit 0
          CURRENT=$(readlink -f current 2>/dev/null || echo "")
          ls -dt blacklist-v*/ 2>/dev/null | tail -n +3 | while read -r dir; do
            FULL=$(readlink -f "$dir")
            if [ "$FULL" != "$CURRENT" ]; then
              echo "🗑️  Removing old version: $dir"
              sudo rm -rf "$dir"
            fi
          done
          CLEANUP

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/sandbox_key
