name: Deploy (Airgap)

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g. v3.5.40). Leave empty for latest."
        required: false

env:
  DEPLOY_BASE: /opt/blacklist

jobs:
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, deploy]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15

    steps:
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Get latest release tag from GitHub API
            VERSION=$(curl -sf \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | grep '"tag_name"' | head -1 | sed 's/.*"tag_name": *"//;s/".*//')
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_num=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "📦 Deploying version: ${VERSION}"

      - name: Check if already deployed
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version_num }}"
          DEPLOY_DIR="${{ env.DEPLOY_BASE }}/blacklist-v${VERSION}"

          if [ -d "${DEPLOY_DIR}" ]; then
            if docker compose -f "${DEPLOY_DIR}/docker-compose.yml" ps --format json 2>/dev/null | grep -q "running"; then
              echo "::warning::v${VERSION} already deployed and running"
              echo "already_running=true" >> "$GITHUB_OUTPUT"
            else
              echo "already_running=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "already_running=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download airgap bundle
        if: steps.check.outputs.already_running != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NUM="${{ steps.version.outputs.version_num }}"
          BUNDLE="blacklist-airgap-${VERSION_NUM}.tar.gz"

          cd ${{ env.DEPLOY_BASE }}

          echo "⬇️  Downloading ${BUNDLE}..."

          # Get asset download URL via GitHub API
          ASSET_URL=$(curl -sf \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${VERSION}" \
            | grep -B3 "\"name\": \"${BUNDLE}\"" \
            | grep '"url"' | head -1 | sed 's/.*"url": *"//;s/".*//')

          if [ -z "${ASSET_URL}" ]; then
            echo "::error::Could not find asset ${BUNDLE} in release ${VERSION}"
            exit 1
          fi

          # Download the actual asset binary
          curl -fL -o "${BUNDLE}" \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "${ASSET_URL}"

          if [ ! -f "${BUNDLE}" ] || [ ! -s "${BUNDLE}" ]; then
            echo "::error::Failed to download ${BUNDLE}"
            exit 1
          fi

          echo "📦 Downloaded: $(du -h ${BUNDLE} | cut -f1)"

      - name: Extract bundle
        if: steps.check.outputs.already_running != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NUM="${{ steps.version.outputs.version_num }}"
          BUNDLE="blacklist-airgap-${VERSION_NUM}.tar.gz"
          DEPLOY_DIR="${{ env.DEPLOY_BASE }}/blacklist-v${VERSION_NUM}"

          cd ${{ env.DEPLOY_BASE }}

          # Clean existing directory to avoid stale files (e.g. from manual deploys)
          if [ -d "${DEPLOY_DIR}" ]; then
            echo "🧹 Removing existing ${DEPLOY_DIR}..."
            rm -rf "${DEPLOY_DIR}"
          fi

          echo "📂 Extracting to ${DEPLOY_DIR}..."
          mkdir -p "${DEPLOY_DIR}"
          tar -xzf "${BUNDLE}" -C "${DEPLOY_DIR}" --strip-components=1

          # Fix checksum filename: older bundles used SHA256SUMS, newer use checksums.sha256
          # If both exist, SHA256SUMS is the correct build-generated one
          IMG_DIR="${DEPLOY_DIR}/images"
          if [ -f "${IMG_DIR}/SHA256SUMS" ] && [ -f "${IMG_DIR}/checksums.sha256" ]; then
            echo "🔧 Replacing stale checksums.sha256 with build-generated SHA256SUMS"
            mv -f "${IMG_DIR}/SHA256SUMS" "${IMG_DIR}/checksums.sha256"
          elif [ -f "${IMG_DIR}/SHA256SUMS" ]; then
            mv "${IMG_DIR}/SHA256SUMS" "${IMG_DIR}/checksums.sha256"
          fi

          echo "✅ Extracted"
          ls -la "${DEPLOY_DIR}/"

      - name: Update deploy files from latest master
        if: steps.check.outputs.already_running != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NUM="${{ steps.version.outputs.version_num }}"
          DEPLOY_DIR="${{ env.DEPLOY_BASE }}/blacklist-v${VERSION_NUM}"
          REPO="${{ github.repository }}"

          echo "🔄 Updating install.sh and docker-compose.yml from latest master..."

          for file in install.sh docker-compose.yml; do
            curl -sf \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/${REPO}/contents/deploy/airgap/${file}?ref=master" \
              -o "${DEPLOY_DIR}/${file}"

            if [ -f "${DEPLOY_DIR}/${file}" ] && [ -s "${DEPLOY_DIR}/${file}" ]; then
              echo "  ✅ ${file} updated"
            else
              echo "  ⚠️  Failed to download ${file}, using bundled version"
            fi
          done

          chmod +x "${DEPLOY_DIR}/install.sh"

      - name: Preserve environment
        if: steps.check.outputs.already_running != 'true'
        run: |
          VERSION_NUM="${{ steps.version.outputs.version_num }}"
          DEPLOY_DIR="${{ env.DEPLOY_BASE }}/blacklist-v${VERSION_NUM}"

          # Find existing .env from any previous deployment
          EXISTING_ENV=""
          for dir in ${{ env.DEPLOY_BASE }}/blacklist-v*/; do
            if [ -f "${dir}.env" ] && [ "${dir}" != "${DEPLOY_DIR}/" ]; then
              EXISTING_ENV="${dir}.env"
            fi
          done

          # Also check backup
          if [ -z "${EXISTING_ENV}" ] && [ -f "${{ env.DEPLOY_BASE }}/env-backup-latest.env" ]; then
            EXISTING_ENV="${{ env.DEPLOY_BASE }}/env-backup-latest.env"
          fi

          if [ -n "${EXISTING_ENV}" ] && [ -f "${EXISTING_ENV}" ]; then
            echo "🔑 Copying .env from ${EXISTING_ENV}"
            cp "${EXISTING_ENV}" "${DEPLOY_DIR}/.env"
            cp "${EXISTING_ENV}" "${{ env.DEPLOY_BASE }}/env-backup-latest.env"
          else
            echo "::notice::No existing .env found. install.sh will generate new secrets."
          fi

      - name: Preserve data volumes
        if: steps.check.outputs.already_running != 'true'
        run: |
          VERSION_NUM="${{ steps.version.outputs.version_num }}"
          DEPLOY_DIR="${{ env.DEPLOY_BASE }}/blacklist-v${VERSION_NUM}"

          for dir in ${{ env.DEPLOY_BASE }}/blacklist-v*/; do
            if [ "${dir}" != "${DEPLOY_DIR}/" ] && [ -d "${dir}data" ]; then
              echo "📁 Copying data from ${dir}data"
              cp -a "${dir}data" "${DEPLOY_DIR}/data" 2>/dev/null || true
              break
            fi
          done

          mkdir -p "${DEPLOY_DIR}/data/logs"

      - name: Stop previous deployment
        if: steps.check.outputs.already_running != 'true'
        run: |
          for dir in ${{ env.DEPLOY_BASE }}/blacklist-v*/; do
            if [ -f "${dir}docker-compose.yml" ]; then
              echo "🛑 Stopping containers in ${dir}..."
              docker compose -f "${dir}docker-compose.yml" down --remove-orphans 2>/dev/null || true
            fi
          done

          for c in blacklist-app blacklist-collector blacklist-frontend blacklist-postgres blacklist-redis; do
            docker rm -f "$c" 2>/dev/null || true
          done

      - name: Install
        if: steps.check.outputs.already_running != 'true'
        run: |
          VERSION_NUM="${{ steps.version.outputs.version_num }}"
          DEPLOY_DIR="${{ env.DEPLOY_BASE }}/blacklist-v${VERSION_NUM}"

          cd "${DEPLOY_DIR}"
          bash install.sh --skip-ssl 2>&1

      - name: Health check
        run: |
          echo "⏳ Waiting for services to start..."
          sleep 15

          max_retries=6
          retry=0
          until curl -sf http://localhost:2542/api/health > /dev/null 2>&1; do
            retry=$((retry + 1))
            if [ $retry -ge $max_retries ]; then
              echo "::error::Health check failed after $max_retries retries"
              docker ps -a --format "table {{.Names}}\t{{.Status}}"
              VERSION_NUM="${{ steps.version.outputs.version_num }}"
              docker compose -f "${{ env.DEPLOY_BASE }}/blacklist-v${VERSION_NUM}/docker-compose.yml" logs --tail=30
              exit 1
            fi
            echo "  Retry $retry/$max_retries..."
            sleep 10
          done

          echo ""
          echo "✅ API healthy"

          if curl -sf http://localhost:8545/health > /dev/null 2>&1; then
            echo "✅ Collector healthy"
          else
            echo "⚠️  Collector not responding (may be starting)"
          fi

          if curl -sk https://localhost:443 > /dev/null 2>&1; then
            echo "✅ Frontend accessible"
          else
            echo "⚠️  Frontend not responding"
          fi

          docker ps --format "table {{.Names}}\t{{.Status}}"

      - name: Cleanup old versions
        if: success()
        run: |
          VERSION_NUM="${{ steps.version.outputs.version_num }}"
          CURRENT="blacklist-v${VERSION_NUM}"

          cd ${{ env.DEPLOY_BASE }}

          # Keep current + one previous, remove older
          ls -dt blacklist-v*/ 2>/dev/null | tail -n +3 | while read dir; do
            if [ "$(basename $dir)" != "${CURRENT}" ]; then
              echo "🗑️  Removing old deployment: ${dir}"
              rm -rf "${dir}"
            fi
          done

          # Remove old bundles (keep latest 2)
          ls -t blacklist-airgap-*.tar.gz 2>/dev/null | tail -n +3 | while read bundle; do
            echo "🗑️  Removing old bundle: ${bundle}"
            rm -f "${bundle}"
          done

          docker image prune -f > /dev/null 2>&1 || true
          echo "✅ Cleanup complete"
