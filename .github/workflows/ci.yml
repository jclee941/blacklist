# Consolidated CI Pipeline
# Replaces: ci.yml (frontend-only) + ci-new.yml (self-hosted only)
# Fixes: tsc error suppression (|| echo), vitest continue-on-error, missing backend CI
# Runner: Set vars.RUNNER to 'self-hosted' in repo settings for self-hosted runner
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      collector: ${{ steps.filter.outputs.collector }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'app/**'
              - 'tests/**'
            collector:
              - 'collector/**'

  lint-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  lint-backend:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.collector == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install ruff==0.9.10
      - run: ruff check app/ collector/
      - run: ruff format --check app/ collector/

  test-frontend:
    needs: lint-frontend
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run tests with coverage
        run: npm run test -- --coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30

  test-backend:
    needs: lint-backend
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: blacklist
          POSTGRES_PASSWORD: blacklist
          POSTGRES_DB: blacklist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U blacklist"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://blacklist:blacklist@localhost:5432/blacklist_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r app/requirements.txt pytest-cov
      - name: Run tests with coverage
        run: |
          python -m pytest tests/unit -v \
            --cov=app/core \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 30

  build:
    needs: [detect-changes, lint-frontend, lint-backend, test-frontend, test-backend]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.detect-changes.outputs.frontend == 'true' ||
       needs.detect-changes.outputs.backend == 'true' ||
       needs.detect-changes.outputs.collector == 'true')
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, app, collector]
        include:
          - service: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
          - service: app
            context: .
            dockerfile: app/Dockerfile
          - service: collector
            context: .
            dockerfile: collector/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: blacklist-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker save blacklist-${{ matrix.service }}:ci | gzip > ${{ matrix.service }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: ${{ matrix.service }}.tar.gz
          retention-days: 1

  e2e:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
      - name: Load images
        run: |
          for f in *.tar.gz; do
            gunzip -c "$f" | docker load
          done
      - name: Start services
        run: docker compose -f .github/docker-compose.ci.yml up -d --wait --wait-timeout 120
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: https://localhost:3443
      - name: Collect logs
        if: failure()
        run: docker compose -f .github/docker-compose.ci.yml logs --no-color > docker-logs.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-logs
          path: |
            docker-logs.txt
            frontend/test-results/
          retention-days: 7
      - if: always()
        run: docker compose -f .github/docker-compose.ci.yml down -v
