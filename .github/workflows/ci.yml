# Consolidated CI Pipeline
# Replaces: ci.yml (frontend-only) + ci-new.yml (self-hosted only)
# Fixes: vitest continue-on-error, missing backend CI
# Runner: Set vars.RUNNER to 'self-hosted' in repo settings for self-hosted runner
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      collector: ${{ steps.filter.outputs.collector }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_TARGET="origin/${{ github.base_ref }}...HEAD"
          else
            DIFF_TARGET="HEAD~1"
          fi
          CHANGED=$(git diff --name-only $DIFF_TARGET 2>/dev/null || git diff --name-only HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          echo "frontend=$(echo "$CHANGED" | grep -q '^frontend/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "backend=$(echo "$CHANGED" | grep -qE '^(app/|tests/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "collector=$(echo "$CHANGED" | grep -q '^collector/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ci=$(echo "$CHANGED" | grep -qE '^(\.github/|postgres/|deploy/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Replaces inline lint-frontend with reusable workflow
  lint-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/_ci-node.yml
    with:
      node-version: "20"
      working-directory: frontend
      run-lint: true
      run-typecheck: true
    secrets: inherit

  lint-backend:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.collector == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==0.9.10
      - run: ruff check app/ collector/
      - run: ruff format --check app/ collector/

  test-frontend:
    needs: [detect-changes, lint-frontend]
    if: >-
      always() && !failure() && !cancelled() &&
      needs.detect-changes.outputs.frontend == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run tests with coverage
        run: npm run test -- --coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30

  test-backend:
    needs: [detect-changes, lint-backend]
    if: >-
      always() && !failure() && !cancelled() &&
      needs.detect-changes.outputs.backend == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: blacklist
          POSTGRES_PASSWORD: blacklist
          POSTGRES_DB: blacklist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U blacklist"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://blacklist:blacklist@localhost:5432/blacklist_test
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: blacklist_test
      POSTGRES_USER: blacklist
      POSTGRES_PASSWORD: blacklist
      PYTHONPATH: app
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r app/requirements.txt pytest-cov
      - name: Run tests with coverage
        run: |
          python -m pytest tests/unit --ignore=tests/unit/collector -v \
            --cov=app/core \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 30

  test-collector:
    needs: [detect-changes, lint-backend]
    if: >-
      always() && !failure() && !cancelled() &&
      needs.detect-changes.outputs.collector == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r collector/requirements.txt pytest-cov
      - name: Run collector tests with coverage
        env:
          PYTHONPATH: collector
        run: |
          python -m pytest tests/unit/collector -v \
            -o 'pythonpath=["collector"]' \
            --cov=collector/core \
            --cov-report=term-missing \
            --cov-report=xml:collector-coverage.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: collector-coverage
          path: collector-coverage.xml
          retention-days: 30

  test-integration:
    needs: [detect-changes, lint-backend, test-backend]
    if: >-
      always() && !failure() && !cancelled() &&
      needs.detect-changes.outputs.backend == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: blacklist
          POSTGRES_PASSWORD: blacklist
          POSTGRES_DB: blacklist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U blacklist"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://blacklist:blacklist@localhost:5432/blacklist_test
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: blacklist_test
      POSTGRES_USER: blacklist
      POSTGRES_PASSWORD: blacklist
      PYTHONPATH: app
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r app/requirements.txt pytest
      - name: Run integration tests
        run: |
          python -m pytest tests/integration -v \
            --tb=short

  build:
    needs:
      [
        detect-changes,
        lint-frontend,
        lint-backend,
        test-frontend,
        test-backend,
        test-collector,
        test-integration,
      ]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.detect-changes.outputs.frontend == 'true' ||
       needs.detect-changes.outputs.backend == 'true' ||
       needs.detect-changes.outputs.collector == 'true' ||
       needs.detect-changes.outputs.ci == 'true')
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, app, collector]
        include:
          - service: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - service: app
            context: .
            dockerfile: app/Dockerfile
          - service: collector
            context: .
            dockerfile: collector/Dockerfile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: blacklist-${{ matrix.service }}:ci
          build-args: |
            APP_VERSION=ci
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker save blacklist-${{ matrix.service }}:ci | gzip > ${{ matrix.service }}.tar.gz
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: image-${{ matrix.service }}
          path: ${{ matrix.service }}.tar.gz
          retention-days: 1

  scan-images:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, app, collector]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.service }}
      - name: Load image
        run: gunzip -c ${{ matrix.service }}.tar.gz | docker load
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: blacklist-${{ matrix.service }}:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  e2e:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
      - name: Load images
        run: |
          for f in *.tar.gz; do
            gunzip -c "$f" | docker load
          done
      - name: Start services
        run: |
          docker compose -f .github/docker-compose.ci.yml up -d --wait --wait-timeout 120 || {
            echo '::group::Collector logs'
            docker compose -f .github/docker-compose.ci.yml logs collector
            echo '::endgroup::'
            echo '::group::App logs'
            docker compose -f .github/docker-compose.ci.yml logs app
            echo '::endgroup::'
            exit 1
          }
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: https://localhost:3443
          WEBKIT_ENABLED: "true"
      - name: Collect logs
        if: failure()
        run: docker compose -f .github/docker-compose.ci.yml logs --no-color > docker-logs.txt 2>&1
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: e2e-failure-logs
          path: |
            docker-logs.txt
            frontend/test-results/
          retention-days: 7
      - if: always()
        run: docker compose -f .github/docker-compose.ci.yml down -v

  coverage-report:
    needs: [test-frontend, test-backend, test-collector]
    if: always() && !cancelled()
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-coverage"
          merge-multiple: true
      - name: Coverage summary
        run: |
          echo "## Coverage Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -d coverage ]; then
            echo "✅ Frontend coverage report uploaded" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f coverage.xml ]; then
            echo "✅ Backend coverage report uploaded" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f collector-coverage.xml ]; then
            echo "✅ Collector coverage report uploaded" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download artifacts from the Actions tab for detailed reports." >> "$GITHUB_STEP_SUMMARY"

  # Single required status check for branch protection.
  # Solves: path-filtered jobs get SKIPPED, which doesn't satisfy required checks.
  # Make 'ci-gate' the ONLY required check in branch protection settings.
  ci-gate:
    needs:
      [
        detect-changes,
        lint-frontend,
        lint-backend,
        test-frontend,
        test-backend,
        test-collector,
        test-integration,
        build,
        coverage-report,
      ]
    if: always() && !cancelled()
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        run: |
          echo "## CI Gate Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          results=(
            "detect-changes=${{ needs.detect-changes.result }}"
            "lint-frontend=${{ needs.lint-frontend.result }}"
            "lint-backend=${{ needs.lint-backend.result }}"
            "test-frontend=${{ needs.test-frontend.result }}"
            "test-backend=${{ needs.test-backend.result }}"
            "test-collector=${{ needs.test-collector.result }}"
            "test-integration=${{ needs.test-integration.result }}"
            "build=${{ needs.build.result }}"
            "coverage-report=${{ needs.coverage-report.result }}"
          )
          failed=false
          for r in "${results[@]}"; do
            job="${r%%=*}"
            result="${r##*=}"
            if [ "$result" = "failure" ]; then
              echo "❌ $job: $result" >> "$GITHUB_STEP_SUMMARY"
              failed=true
            elif [ "$result" = "cancelled" ]; then
              echo "⚠️ $job: $result" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "✅ $job: $result" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$failed" = "true" ]; then
            echo ""
            echo "CI gate FAILED — one or more jobs failed."
            exit 1
          fi
          echo ""
          echo "CI gate PASSED — all jobs succeeded or were skipped."

  push-images:
    needs: [build, e2e, scan-images]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    concurrency:
      group: deploy-ghcr-master
      cancel-in-progress: false
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Reuse artifacts from build job (no rebuild)
          - service: frontend
            from-artifact: true
          - service: app
            from-artifact: true
          - service: collector
            from-artifact: true
          # Build fresh (not in CI build matrix, lightweight images)
          - service: postgres
            from-artifact: false
            context: ./postgres
            dockerfile: postgres/Dockerfile
          - service: redis
            from-artifact: false
            context: ./redis
            dockerfile: redis/Dockerfile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ !matrix.from-artifact }}
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        if: ${{ !matrix.from-artifact }}

      # Load pre-built image from artifact (frontend, app, collector)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ matrix.from-artifact }}
        with:
          name: image-${{ matrix.service }}
      - name: Load image from artifact
        if: ${{ matrix.from-artifact }}
        run: gunzip -c ${{ matrix.service }}.tar.gz | docker load

      # Build fresh (postgres, redis — not part of CI test matrix)
      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        if: ${{ !matrix.from-artifact }}
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: blacklist-${{ matrix.service }}:ci
          build-args: |
            APP_VERSION=latest
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Push to GHCR
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push to GHCR
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/blacklist-${{ matrix.service }}"
          docker tag "blacklist-${{ matrix.service }}:ci" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
