# Reusable / Manual — Build Docker Images
# Fixes: matrix include bug (now uses proper base dimension), hardcoded self-hosted runner
name: Build Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag'
        type: string
        default: 'latest'
  workflow_call:
    inputs:
      version:
        type: string
        default: 'latest'

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, app, collector, postgres, redis]
        include:
          - service: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - service: app
            context: .
            dockerfile: app/Dockerfile
          - service: collector
            context: .
            dockerfile: collector/Dockerfile
          - service: postgres
            context: ./postgres
            dockerfile: postgres/Dockerfile
          - service: redis
            context: .
            dockerfile: deploy/redis/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Set image tags
        id: meta
        run: |
          SERVICE="${{ matrix.service }}"
          VERSION="${{ inputs.version }}"
          TAGS="blacklist-${SERVICE}:${VERSION}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ inputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        run: |
          docker save blacklist-${{ matrix.service }}:${{ inputs.version }} | \
            gzip > blacklist-${{ matrix.service }}.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.service }}
          path: blacklist-${{ matrix.service }}.tar.gz
          retention-days: 5
