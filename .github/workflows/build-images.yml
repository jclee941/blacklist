# Reusable / Manual — Build Docker Images
# Fixes: matrix include bug (now uses proper base dimension), hardcoded self-hosted runner
# Runner: Set vars.RUNNER to 'self-hosted' in repo settings for self-hosted runner
name: Build Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag'
        type: string
        default: 'latest'
      push:
        description: 'Push to GHCR after build'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        default: 'latest'
      push:
        type: boolean
        default: false

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, app, collector, postgres, redis]
        include:
          - service: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - service: app
            context: .
            dockerfile: app/Dockerfile
          - service: collector
            context: .
            dockerfile: collector/Dockerfile
          - service: postgres
            context: ./postgres
            dockerfile: postgres/Dockerfile
          - service: redis
            context: ./redis
            dockerfile: redis/Dockerfile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          SERVICE="${{ matrix.service }}"
          VERSION="${{ inputs.version }}"
          if [ "${{ inputs.push }}" = "true" ]; then
            REGISTRY="ghcr.io/${{ github.repository }}"
            TAGS="${REGISTRY}/blacklist-${SERVICE}:${VERSION}"
            if [ "${VERSION}" != "latest" ]; then
              TAGS="${TAGS},${REGISTRY}/blacklist-${SERVICE}:latest"
            fi
          else
            TAGS="blacklist-${SERVICE}:${VERSION}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ inputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        if: ${{ !inputs.push }}
        run: |
          docker save blacklist-${{ matrix.service }}:${{ inputs.version }} | \
            gzip > blacklist-${{ matrix.service }}.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.push }}
        with:
          name: image-${{ matrix.service }}
          path: blacklist-${{ matrix.service }}.tar.gz
          retention-days: 5
