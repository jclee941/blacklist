name: Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20"
      working-directory:
        required: false
        type: string
        default: "."
      run-lint:
        required: false
        type: boolean
        default: false
      run-typecheck:
        required: false
        type: boolean
        default: false
      run-test:
        required: false
        type: boolean
        default: false

jobs:
  node-ci:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      # FIX for vitest 4.0.18: Clear npm cache to prevent nested dependency resolution issues
      # GitHub Actions cache can contain corrupted entries for complex nested dependencies
      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        if: ${{ inputs.run-lint }}
        run: npm run lint

      - name: Run Type Check
        if: ${{ inputs.run-typecheck }}
        run: npm run typecheck

      - name: Run Tests
        if: ${{ inputs.run-test }}
        run: npm test
