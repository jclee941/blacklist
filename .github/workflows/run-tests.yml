# Reusable / Manual — Run Tests
# Fixes: uses app/requirements.txt (not dev), flexible runner
# Runner: Set vars.RUNNER to 'self-hosted' in repo settings for self-hosted runner
name: Run Tests

on:
  workflow_dispatch:
    inputs:
      test-type:
        description: 'Test suite to run'
        required: true
        type: choice
        options:
          - all
          - backend-unit
          - frontend-unit
  workflow_call:
    inputs:
      test-type:
        required: true
        type: string

jobs:
  backend-unit:
    if: inputs.test-type == 'backend-unit' || inputs.test-type == 'all'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: blacklist
          POSTGRES_PASSWORD: blacklist
          POSTGRES_DB: blacklist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U blacklist"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://blacklist:blacklist@localhost:5432/blacklist_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r app/requirements.txt
      - run: python -m pytest tests/unit -v --cov=app/core --cov-report=term-missing

  frontend-unit:
    if: inputs.test-type == 'frontend-unit' || inputs.test-type == 'all'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
